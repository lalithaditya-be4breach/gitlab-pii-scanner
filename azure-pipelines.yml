# azure-pipelines.yml
# ====================
#
# Task 2, Phase 3: Azure DevOps integration for the GitLab PII Scanner.
#
# DIAGNOSTIC VERSION
# Cache and artifact publishing are temporarily removed to isolate
# Azure DevOps task-related failures.

trigger:
  branches:
    include:
      - main
      - task2-ai-devsecops-pipeline

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  pythonVersion: "3.11"

  SCANNER_ENVIRONMENT: "ci"
  SCANNER_OUTPUT_DIR: "$(Build.SourcesDirectory)/output"
  PRESIDIO_SPACY_MODEL: "en_core_web_lg"
  RISK_WARNING_THRESHOLD: "20"
  RISK_FAIL_THRESHOLD: "50"
  REPORT_REDACTION_ENABLED: "true"

  AI_PROVIDER: "null"
  AI_MODEL: "gpt-4o-mini"

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: "Set up Python $(pythonVersion)"
    inputs:
      versionSpec: "$(pythonVersion)"
      addToPath: true

  - script: |
      set -e
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: "Install dependencies"

  - script: |
      set -e
      python -m spacy download "$PRESIDIO_SPACY_MODEL"
    displayName: "Download spaCy model ($(PRESIDIO_SPACY_MODEL))"

  - script: |
      set -e
      python main.py local --path "$(Build.SourcesDirectory)"
    displayName: "Run PII scanner (existing CLI, unchanged)"
    env:
      AI_API_KEY: $(AI_API_KEY)
      AI_AZURE_ENDPOINT: $(AI_AZURE_ENDPOINT)

  - script: |
      set -e
      python ci/evaluate_gate.py --report-path "$(SCANNER_OUTPUT_DIR)/reports/latest.json"
    displayName: "Evaluate pipeline gate (reads summary.pipeline_status only)"