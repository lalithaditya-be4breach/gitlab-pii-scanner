# azure-pipelines.yml
#
# Azure DevOps CI pipeline for the GitLab PII Scanner.
#
# Azure DevOps orchestrates the workflow only.
# Detection, risk scoring and reporting remain inside the scanner.

trigger:
  branches:
    include:
      - main
      - task2-ai-devsecops-pipeline

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  pythonVersion: "3.11"

  # Scanner configuration
  SCANNER_ENVIRONMENT: "ci"
  SCANNER_OUTPUT_DIR: "$(Build.SourcesDirectory)"
  PRESIDIO_SPACY_MODEL: "en_core_web_lg"
  RISK_WARNING_THRESHOLD: "20"
  RISK_FAIL_THRESHOLD: "50"
  REPORT_REDACTION_ENABLED: "true"

  # AI configuration
  AI_PROVIDER: "null"
  AI_MODEL: "gpt-4o-mini"

steps:

# ------------------------------------------------------------------
# Python
# ------------------------------------------------------------------

- task: UsePythonVersion@0
  displayName: "Use Python $(pythonVersion)"
  inputs:
    versionSpec: "$(pythonVersion)"
    addToPath: true

# ------------------------------------------------------------------
# Cache
# ------------------------------------------------------------------

- task: Cache@2
  displayName: "Cache pip packages"
  inputs:
    key: 'python | "$(Agent.OS)" | requirements.txt'
    restoreKeys: |
      python | "$(Agent.OS)"
    path: "$(Pipeline.Workspace)/.pip-cache"

# ------------------------------------------------------------------
# Install dependencies
# ------------------------------------------------------------------

- script: |
    python -m pip install --upgrade pip
    pip install \
      --cache-dir "$(Pipeline.Workspace)/.pip-cache" \
      -r requirements.txt
  displayName: "Install dependencies"

# ------------------------------------------------------------------
# Download spaCy model
# ------------------------------------------------------------------

- script: |
    python -m spacy download "$(PRESIDIO_SPACY_MODEL)"
  displayName: "Download spaCy model"

# ------------------------------------------------------------------
# Run unit tests
# ------------------------------------------------------------------

- script: |
    pytest -rs
  displayName: "Run unit tests"

# ------------------------------------------------------------------
# Execute scanner
# ------------------------------------------------------------------

- script: |
    set -e

    echo "=============================================="
    echo "Running scanner..."
    echo "=============================================="

    python main.py local --path "$(Build.SourcesDirectory)"

    echo ""
    echo "=============================================="
    echo "Scanner finished successfully"
    echo "=============================================="

    echo ""
    echo "Searching for ALL generated reports..."
    find "$(Build.SourcesDirectory)" -type f | grep -Ei \
      "scan_report.json|dashboard.json|AI_Summary.md|Developer_Guidance.md|Executive_Report.html|Dashboard.html" || true

    echo ""
    echo "Searching for report directories..."
    find "$(Build.SourcesDirectory)" -type d | grep -Ei \
      "reports|output" || true
  displayName: "Run GitLab PII Scanner"
  env:
    AI_API_KEY: $(AI_API_KEY)
    AI_AZURE_ENDPOINT: $(AI_AZURE_ENDPOINT)

# ------------------------------------------------------------------
# Evaluate gate
# ------------------------------------------------------------------

- script: |
    python ci/evaluate_gate.py --report-path "$(Build.SourcesDirectory)/reports/latest/scan_report.json"
  displayName: "Evaluate Security Gate"

# ------------------------------------------------------------------
# Publish reports
# ------------------------------------------------------------------

- task: PublishPipelineArtifact@1
  displayName: "Publish Reports"
  condition: always()
  inputs:
    targetPath: "$(Build.SourcesDirectory)/reports"
    artifact: "pii-scan-reports"